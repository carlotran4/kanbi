<div id="kanbi-sidebar-prototypes" aria-label="Kanbi Operator sidebar alternatives">
<style>
#kanbi-sidebar-prototypes{--kb-bg:light-dark(#fafafa,#1a1b26);--kb-fg:light-dark(#343b58,#a9b1d6);--kb-bright:light-dark(#24283b,#c0caf5);--kb-dim:light-dark(#66708e,#8992b8);--kb-line:light-dark(#bdc4db,#414868);--kb-card:light-dark(#eff1f8,#24283b);--kb-selected:light-dark(#e1e7f4,#292e42);--kb-accent:light-dark(#34548a,#7aa2f7);--kb-red:light-dark(#ae3658,#f7768e);--kb-yellow:light-dark(#8f5e00,#e0af68);--kb-green:light-dark(#487328,#9ece6a);color:var(--kb-fg);font:12px/18px ui-monospace,SFMono-Regular,Consolas,monospace}
#kanbi-sidebar-prototypes *{box-sizing:border-box}
#kanbi-sidebar-prototypes .fallback{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px;align-items:center;font-size:14px;line-height:1.5}
#kanbi-sidebar-prototypes .fallback label{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#kanbi-sidebar-prototypes .fallback select{font:inherit;background:var(--kb-bg);color:var(--kb-fg);border:1px solid var(--kb-line);padding:3px}
#kanbi-sidebar-prototypes .surface{background:var(--kb-bg);padding:8px;max-width:100%}
#kanbi-sidebar-prototypes .terminal{position:relative;margin:auto;width:120ch;height:648px;background:var(--kb-bg);color:var(--kb-fg)}
#kanbi-sidebar-prototypes .frame span{box-decoration-break:clone;padding-block:2px}
#kanbi-sidebar-prototypes .frame{margin:0;white-space:pre;font:inherit}
#kanbi-sidebar-prototypes .sidebar{position:absolute;top:18px;bottom:18px;right:0;width:36ch;padding:0 1ch 0 2ch;background:var(--kb-bg);border-left:1px solid var(--kb-line);display:flex;flex-direction:column;min-width:0}
#kanbi-sidebar-prototypes button{font:inherit;color:inherit;background:transparent;border:0;box-shadow:none;border-radius:0;padding:0;text-align:left;cursor:var(--cursor-interaction,default)}
#kanbi-sidebar-prototypes .heading{height:36px;flex:none;border-bottom:1px solid var(--kb-line);display:flex;justify-content:space-between;align-items:flex-start;color:var(--kb-bright);font-weight:500;gap:1ch}
#kanbi-sidebar-prototypes .sidebar[data-focused="true"] .heading>span{color:var(--kb-accent)}
#kanbi-sidebar-prototypes .sidebar.closed>*{visibility:hidden}
#kanbi-sidebar-prototypes .heading button{color:var(--kb-dim);font-weight:400}
#kanbi-sidebar-prototypes .list{padding-top:18px;min-height:0;flex:1;display:flex;flex-direction:column;gap:18px;overflow:hidden}
#kanbi-sidebar-prototypes .operator{display:block;flex:none;width:100%;min-width:0;line-height:18px;position:relative;padding:0 1ch 0 1ch;border-left:2px solid transparent}
#kanbi-sidebar-prototypes .operator .top{display:flex;justify-content:space-between;gap:1ch;color:var(--kb-bright);font-weight:500;white-space:nowrap}
#kanbi-sidebar-prototypes .operator .name{overflow:hidden;text-overflow:ellipsis;min-width:0}
#kanbi-sidebar-prototypes .operator .harness{color:var(--kb-dim);font-weight:400;flex-shrink:0}
#kanbi-sidebar-prototypes .operator .status,#kanbi-sidebar-prototypes .operator .reason{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--kb-dim)}
#kanbi-sidebar-prototypes .operator[aria-selected="true"]{border-left-color:var(--kb-accent);background:var(--kb-selected)}
#kanbi-sidebar-prototypes .cards .operator{background:var(--kb-card)}
#kanbi-sidebar-prototypes .cards .operator[aria-selected="true"]{background:var(--kb-selected)}
#kanbi-sidebar-prototypes .operator.failed .status,#kanbi-sidebar-prototypes .operator.failed .reason{color:var(--kb-red)}
#kanbi-sidebar-prototypes .operator.attention .status,#kanbi-sidebar-prototypes .operator.attention .reason{color:var(--kb-yellow)}
#kanbi-sidebar-prototypes .operator.failed{border-left-color:var(--kb-red)}
#kanbi-sidebar-prototypes .operator.attention{border-left-color:var(--kb-yellow)}
#kanbi-sidebar-prototypes .roster .operator{padding-left:0;border-left:0}
#kanbi-sidebar-prototypes .roster .operator[aria-selected="true"] .name{color:var(--kb-accent)}
#kanbi-sidebar-prototypes .roster .operator .harness{display:block}
#kanbi-sidebar-prototypes .roster .operator .status{display:none}
#kanbi-sidebar-prototypes .roster .operator .top{font-weight:400}
#kanbi-sidebar-prototypes .roster .operator[aria-selected="true"] .top{font-weight:500}
#kanbi-sidebar-prototypes .details .list{gap:0;flex:1}
#kanbi-sidebar-prototypes .details .operator{height:36px;border-left:0;padding-left:0}
#kanbi-sidebar-prototypes .details .operator .top{font-weight:400}
#kanbi-sidebar-prototypes .details .operator .status,#kanbi-sidebar-prototypes .details .operator .reason{display:none}
#kanbi-sidebar-prototypes .details .operator .harness{color:var(--kb-dim)}
#kanbi-sidebar-prototypes .details .operator.failed .harness{color:var(--kb-red)}
#kanbi-sidebar-prototypes .details .operator.attention .harness{color:var(--kb-yellow)}
#kanbi-sidebar-prototypes .details .operator[aria-selected="true"] .name{color:var(--kb-accent)}
#kanbi-sidebar-prototypes .selection{flex:none;min-height:108px;padding-top:18px;border-top:1px solid var(--kb-line);color:var(--kb-dim);white-space:pre-wrap;overflow-wrap:anywhere}
#kanbi-sidebar-prototypes .selection strong{font-weight:500;color:var(--kb-bright)}
#kanbi-sidebar-prototypes .footer{flex:none;border-top:1px solid var(--kb-line);padding-top:9px;margin-top:9px;min-height:63px;white-space:nowrap;color:var(--kb-dim)}
#kanbi-sidebar-prototypes .footer .actions{display:flex;gap:1ch;flex-wrap:wrap}
#kanbi-sidebar-prototypes .footer button{white-space:nowrap}
#kanbi-sidebar-prototypes button:hover{color:var(--kb-accent)}
#kanbi-sidebar-prototypes .more{height:18px;flex:none;color:var(--kb-dim)}
#kanbi-sidebar-prototypes .action-menu{position:absolute;left:1ch;right:1ch;bottom:72px;border:1px solid var(--kb-accent);padding:9px 1ch;background:var(--kb-bg);z-index:2}
#kanbi-sidebar-prototypes .action-menu button{display:block;line-height:27px;width:100%}
#kanbi-sidebar-prototypes .collapsed{position:absolute;right:1ch;top:36px;color:var(--kb-dim);background:var(--kb-bg);padding:0 1ch}
#kanbi-sidebar-prototypes .status-note{margin-top:9px;color:var(--kb-dim);min-height:18px}
#kanbi-sidebar-prototypes .terminal.large{width:160ch;height:810px}
#kanbi-sidebar-prototypes .terminal.narrow{width:80ch;height:432px}
#kanbi-sidebar-prototypes .narrow .sidebar{top:18px;bottom:18px;width:40ch;border:1px solid var(--kb-accent);padding-top:9px;padding-bottom:9px;border-radius:7px}
#kanbi-sidebar-prototypes .narrow .heading{height:27px}
#kanbi-sidebar-prototypes .narrow .list{padding-top:9px;gap:9px}
#kanbi-sidebar-prototypes .narrow .details .list{gap:0}
#kanbi-sidebar-prototypes .narrow .selection{min-height:90px;padding-top:9px}
#kanbi-sidebar-prototypes .terminal.mobile{width:40ch;height:468px}
#kanbi-sidebar-prototypes .mobile .frame{display:none}
#kanbi-sidebar-prototypes .mobile .sidebar{top:0;bottom:0;width:100%;border:0;padding:0 1ch}
#kanbi-sidebar-prototypes [hidden]{display:none!important}
@media(pointer:coarse){#kanbi-sidebar-prototypes .heading,#kanbi-sidebar-prototypes .narrow .heading{height:44px;min-height:44px}#kanbi-sidebar-prototypes .operator{min-height:44px}#kanbi-sidebar-prototypes .heading button,#kanbi-sidebar-prototypes .footer button{min-height:44px}#kanbi-sidebar-prototypes .footer{white-space:normal;min-height:102px}}
</style>
<div class="fallback" hidden aria-label="Prototype comparisons">
<label>Layout <select class="variant"><option value="cards">A · Board cards</option><option value="roster">B · Compact roster</option><option value="details">C · List + details</option><option value="current">Current sidebar</option></select></label>
<label>Preview <select class="viewport"><option value="auto">Fit screen</option><option value="small">80 × 24</option></select></label>
<label>State <select class="scenario"><option value="fixture">Captured fixture</option><option value="attention">Busy + attention</option><option value="crowded">Crowded list</option></select></label>
</div>
<div class="surface"><div class="terminal" aria-label="Kanbi board with Operators">
<pre class="frame" aria-hidden="true"></pre>
<section class="sidebar cards" aria-label="Workspace Operators">
<div class="heading"><span class="sidebar-title">OPERATORS  6</span><button class="collapse" type="button">O hide</button></div>
<div class="list" role="listbox" aria-label="Operators"></div>
<div class="more"></div>
<div class="selection" hidden></div>
<div class="footer"><div class="actions"><button class="open" type="button">Enter open</button><button class="run" type="button">r run</button><button class="edit" type="button">e edit</button></div><div class="actions"><button class="new" type="button">n new</button><button class="menu-toggle" type="button">? actions</button><button class="return" type="button">Esc board</button></div></div>
<div class="action-menu" hidden><button class="pause" type="button">p  Pause schedule</button><button data-action="Stop turn" type="button">s  Stop turn</button><button data-action="Close session" type="button">x  Close session</button><button data-action="Start fresh" type="button">f  Start fresh</button><button data-action="Delete" type="button">d  Delete Operator</button><button class="menu-close" type="button">Esc  Back</button></div>
</section>
<button class="collapsed" type="button" hidden>O Operators</button>
</div></div>
<div class="status-note" role="status" aria-live="polite"></div>
<script>
(()=>{
 const root=document.getElementById('kanbi-sidebar-prototypes');const q=s=>root.querySelector(s);const frames=__FRAMES__;
 const state={variant:'cards',viewport:'auto',scenario:'fixture'};
 const original=[
 {name:'Intake',harness:'codex',state:'not started',reason:'Next: Nov 7 18:30'},
 {name:'Review triage',harness:'pi',state:'not started',reason:'Next: Nov 7 18:30'},
 {name:'Daily digest',harness:'claude',state:'not started',reason:'Schedule paused',paused:true},
 {name:'Dependency watcher',harness:'copilot',state:'failed',reason:'Resume failed; retry required'},
 {name:'Release follow-ups',harness:'codex',state:'not started',reason:'Next: Nov 7 18:30'},
 {name:'Documentation curator',harness:'pi',state:'not started',reason:'Next: Nov 7 18:30'}
 ];
 let selected=0,collapsed=false,focused=true,start=0,notice='',override={};
 const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function items(){
  const a=original.map(x=>({...x}));
  if(state.scenario==='attention'){a[0].state='running';a[0].reason='Checking incoming requests';a[1].state='awaiting input';a[1].reason='Which board should receive this?';a[4].state='needs permission';a[4].reason='Open session to approve';a[5].state='completed';}
  if(state.scenario==='crowded')for(const [i,name] of ['Build health','Inbox reconciler','Backlog gardener','Customer requests','Release coordinator','Long-term maintenance'].entries())a.push({name,harness:i%2?'pi':'codex',state:'not started',reason:'Next: Nov 7 18:30'});
  for(const [key,value] of Object.entries(override))if(a[key])Object.assign(a[key],value);
  return a;
 }
 function render(){
  const width=root.clientWidth;const narrow=state.viewport==='small'||width<900;const mobile=width<596;const large=!narrow&&width>=1180;const current=state.variant==='current';const list=items();selected=Math.min(selected,list.length-1);
  q('.terminal').className='terminal'+(narrow?' narrow':'')+(mobile?' mobile':'')+(large?' large':'');
  q('.frame').innerHTML=narrow?(current?frames['80x24']:frames.board80):frames[large?'160x45':'120x36'];if(mobile&&current){q('.frame').innerHTML=frames.currentDetail;q('.frame').style.display='block';}else q('.frame').style.display='';
  q('.sidebar').hidden=current;q('.collapsed').hidden=!collapsed||current;
  q('.sidebar').className='sidebar '+state.variant+(collapsed?' closed':'');q('.sidebar').dataset.focused=focused;
  q('.sidebar-title').textContent='OPERATORS  '+list.length;
  q('.selection').hidden=state.variant!=='details';
  const coarse=matchMedia('(pointer:coarse)').matches;const bodyHeight=(mobile?468:(narrow?396:large?774:612))-(coarse?53:36)-(coarse?126:90)-(state.variant==='details'?108:0)-18;
  const rowHeight=state.variant==='cards'?(narrow?63:72):state.variant==='roster'?(coarse?(narrow?53:62):(narrow?45:54)):(coarse?44:36);
  const visible=Math.max(2,Math.min(list.length,Math.floor(bodyHeight/rowHeight)));
  if(selected<start)start=selected;if(selected>=start+visible)start=selected-visible+1;start=Math.max(0,Math.min(start,list.length-visible));
  q('.list').innerHTML=list.slice(start,start+visible).map((o,j)=>{
   const i=start+j;const attention=['awaiting input','needs permission'].includes(o.state);const tone=o.state==='failed'?' failed':attention?' attention':'';
   const status=o.paused?'schedule paused':o.state;
   const glyph=o.state==='failed'?'!':attention?'!':o.paused?'⏸':o.state==='running'?'●':o.state==='completed'?'✓':'○';
   const rosterState=attention?(o.state==='awaiting input'?'input':'permission'):o.state==='failed'?'failed':o.paused?o.state:'';
   const reason=state.variant==='roster'?(attention||o.state==='failed'?o.reason:(o.paused?'Schedule paused':o.state+' · '+o.reason.replace('Next: Nov 7 ',''))):o.reason;
   return '<button type="button" role="option" class="operator'+tone+'" aria-selected="'+(selected===i)+'" data-index="'+i+'" aria-label="'+esc(o.name+', '+status+', '+o.reason)+'"><span class="top"><span class="name">'+esc(o.name)+'</span><span class="harness">'+esc(state.variant==='details'?glyph:state.variant==='roster'?rosterState:o.harness)+'</span></span><span class="status">'+esc(o.state)+'</span><span class="reason">'+esc(reason)+'</span></button>';
  }).join('');
  const moreBelow=list.length-(start+visible);q('.more').textContent=(start?start+' more ↑':'')+(start&&moreBelow?' · ':'')+(moreBelow?moreBelow+' more ↓':'');
  const chosen=list[selected];q('.selection').innerHTML='<strong>'+esc(chosen.name)+'</strong>\n'+esc(chosen.state+' · '+chosen.harness)+'\n'+esc(chosen.reason)+'\n'+(chosen.paused?'Schedule paused':'Every 15m · America/Chicago');
  q('.run').textContent=chosen.state==='failed'?'r retry':'r run';
  q('.pause').textContent=chosen.paused?'p  Resume schedule':'p  Pause schedule';
  q('.status-note').textContent=notice||((current?'Current':{cards:'A · Board cards',roster:'B · Compact roster',details:'C · List + details'}[state.variant])+' · '+(mobile?'Sidebar detail':narrow?'80 × 24':large?'160 × 45':'120 × 36')+(!current&&state.scenario==='attention'?' · Example active/attention states':''));
  root.querySelectorAll('.operator').forEach(b=>b.onclick=()=>{selected=+b.dataset.index;focused=true;notice='';render();q('.operator[aria-selected="true"]').focus({preventScroll:true});});
 }
 q('.collapse').onclick=()=>{collapsed=true;render();};q('.collapsed').onclick=()=>{collapsed=false;focused=true;render();};
 q('.menu-toggle').onclick=()=>{q('.action-menu').hidden=!q('.action-menu').hidden;};q('.menu-close').onclick=()=>q('.action-menu').hidden=true;
 q('.pause').onclick=()=>{const o=items()[selected];override[selected]={...override[selected],paused:!o.paused,reason:o.paused?'Next: Nov 7 18:30':'Schedule paused'};q('.action-menu').hidden=true;notice='Schedule '+(o.paused?'resumed':'paused')+' · preview only';render();};
 q('.run').onclick=()=>{override[selected]={...override[selected],state:'running',reason:'Run now'};notice='Run now · preview only';render();};
 for(const sel of ['.open','.edit','.new'])q(sel).onclick=()=>{notice=sel==='.open'?'Open '+items()[selected].name+' in its Herdr tab · preview only':sel==='.edit'?'Edit '+items()[selected].name+' · preview only':'Create Operator · preview only';render();};
 q('.return').onclick=()=>{focused=false;notice='Board focused · preview only';render();};
 root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{notice=b.dataset.action+' · preview only';q('.action-menu').hidden=true;render();});
 root.addEventListener('keydown',e=>{if(['ArrowDown','j','ArrowUp','k'].includes(e.key)){e.preventDefault();selected=(selected+(e.key==='ArrowDown'||e.key==='j'?1:items().length-1))%items().length;render();q('.operator[aria-selected="true"]').focus({preventScroll:true});}if(e.key==='?')q('.menu-toggle').click();if(e.key==='Escape'){q('.action-menu').hidden=true;notice='Board focused · preview only';focused=false;render();}if(e.key==='p')q('.pause').click();if(e.key==='r')q('.run').click();if(e.key==='O'){collapsed=!collapsed;render();}});
 for(const property of ['variant','viewport','scenario'])q('.'+property).onchange=e=>{state[property]=e.target.value;start=selected=0;override={};notice='';render();};
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{start=selected=0;override={};notice='';render();}});tweak.addSelect(state,'variant',{label:'Sidebar',options:[{label:'A · Board cards',value:'cards'},{label:'B · Compact roster',value:'roster'},{label:'C · List + details',value:'details'},{label:'Current sidebar',value:'current'}]});tweak.addSelect(state,'viewport',{label:'Terminal',options:[{label:'Fit screen',value:'auto'},{label:'80 × 24',value:'small'}]});tweak.addSelect(state,'scenario',{label:'Content',options:[{label:'Captured fixture',value:'fixture'},{label:'Busy + attention',value:'attention'},{label:'Crowded list',value:'crowded'}]});}else q('.fallback').hidden=false;
 new ResizeObserver(()=>render()).observe(root);render();
})();
</script>
</div>
