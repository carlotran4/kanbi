name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: Runtime and synchronization soak
        env:
          KANBI_SOAK_SECONDS: "60"
        run: ./scripts/soak-runtime.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: Install tmux and SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y tmux sqlite3
      - name: Build and smoke the packaged artifact path
        shell: bash
        run: |
          set -euo pipefail
          version=0.0.0-ci
          commit="$(git rev-parse HEAD)"
          ./scripts/build-release.sh "$version"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="dist/kanbi_${version}_$(go env GOOS)_$(go env GOARCH).tar.gz"
          tar -xzf "$archive" -C "$work"
          ./scripts/release-artifact-smoke.sh "$work/kanbi" "$version" "$commit" "$work/BUILDINFO.json"
          KANBI_SMOKE_BIN="$work/kanbi" ./scripts/smoke.sh --skip-checks
