name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Runtime and synchronization soak
        env:
          KANBI_SOAK_SECONDS: "60"
        run: ./scripts/soak-runtime.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux and SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y tmux sqlite3
      - name: Build and smoke the packaged artifact path
        shell: bash
        run: |
          set -euo pipefail
          version=0.0.0-ci
          commit="$(git rev-parse HEAD)"
          ./scripts/build-release.sh "$version"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="dist/kanbi_${version}_$(go env GOOS)_$(go env GOARCH).tar.gz"
          tar -xzf "$archive" -C "$work"
          ./scripts/release-artifact-smoke.sh "$work/kanbi" "$version" "$commit" "$work/BUILDINFO.json"
          KANBI_SMOKE_BIN="$work/kanbi" ./scripts/smoke.sh --skip-checks
