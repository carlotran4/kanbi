name: Performance evidence

on:
  pull_request:
    paths:
      - 'internal/tui/**'
      - 'internal/storage/**'
      - 'internal/runtime/**'
      - 'internal/multiplexer/**'
      - 'scripts/performance*'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install runtime and SQLite
        run: |
          sudo apt-get update && sudo apt-get install -y tmux sqlite3 ripgrep
          ./scripts/install-herdr-ci.sh "$RUNNER_TEMP/herdr-bin"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - name: Compare baseline and candidate on the same runner
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KANBI_PERFORMANCE: '1'
          KANBI_PERFORMANCE_HERDR: '1'
        run: |
          set -euo pipefail
          lscpu
          go version
          herdr --version
          baseline="$(mktemp -d)"
          git worktree add --detach "$baseline" "$BASE_SHA"
          trap 'git worktree remove --force "$baseline"' EXIT
          if [[ -d "$baseline/internal/runtime" ]]; then
            cp internal/tui/performance*_test.go "$baseline/internal/tui/"
            cp scripts/herdr-fixture.py "$baseline/scripts/"
          fi
          # Legacy tmux baselines keep their original measurement sources;
          # copying Herdr imports into them would make the comparison fail.
          (cd "$baseline" && KANBI_PERFORMANCE_FPS=60 KANBI_PERFORMANCE_TMUX=1 go test -v ./internal/tui -run '^TestPerformance(Evidence|Program|External|FileProjection)$' -count=1) | tee /tmp/kanbi-baseline.txt
          go fmt ./...
          KANBI_PERFORMANCE_ENFORCE=1 go test -v ./internal/tui -run '^TestPerformance(Evidence|Program|External|FileProjection)$' -count=1 | tee /tmp/kanbi-candidate.txt
          printf 'Baseline and candidate CPU/service timings; physical screen latency is not measured.\n' >> "$GITHUB_STEP_SUMMARY"
          printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          rg 'PERF |reference Go=' /tmp/kanbi-baseline.txt /tmp/kanbi-candidate.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Idle renderer CPU and traffic
        env:
          KANBI_PERFORMANCE: '1'
        run: go test -v ./internal/tui -run '^TestPerformanceRendererIdle$' -count=3
      - name: Deterministic, race, vet, and smoke verification
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          ./scripts/smoke.sh --skip-checks
      - name: Isolated real application frames
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/performance-ui.py
