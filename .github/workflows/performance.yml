name: Performance evidence

on:
  pull_request:
    paths:
      - 'internal/tui/**'
      - 'internal/storage/**'
      - 'internal/tmux/**'
      - 'scripts/performance*'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Install tmux and SQLite
        run: sudo apt-get update && sudo apt-get install -y tmux sqlite3 ripgrep
      - name: Compare baseline and candidate on the same runner
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KANBI_PERFORMANCE: '1'
        run: |
          set -euo pipefail
          lscpu
          go version
          tmux -V
          baseline="$(mktemp -d)"
          git worktree add --detach "$baseline" "$BASE_SHA"
          trap 'git worktree remove --force "$baseline"' EXIT
          cp internal/tui/performance_evidence_test.go "$baseline/internal/tui/"
          (cd "$baseline" && go test -v ./internal/tui -run '^TestPerformanceEvidence$' -count=1) | tee /tmp/kanbi-baseline.txt
          go fmt ./...
          go test -v ./internal/tui -run '^TestPerformanceEvidence$' -count=1 | tee /tmp/kanbi-candidate.txt
          printf 'Baseline and candidate CPU/service timings; physical screen latency is not measured.\n' >> "$GITHUB_STEP_SUMMARY"
          printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          rg 'PERF |reference Go=' /tmp/kanbi-baseline.txt /tmp/kanbi-candidate.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Deterministic, race, vet, and smoke verification
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          ./scripts/smoke.sh --skip-checks
      - name: Isolated real application frames
        shell: bash
        run: |
          set -euo pipefail
          UI=.pi/skills/kanbi-ui-validation/scripts/ui-session.sh
          trap '$UI stop' EXIT
          $UI start
          $UI capture
          $UI key Enter
          sleep 0.1
          $UI capture
          for key in j j l j k h; do
            $UI key "$key"
            sleep 0.1
            $UI capture
          done
          $UI key '?' 
          sleep 0.1
          $UI capture
          $UI key Escape
          $UI resize 80 24
          sleep 0.1
          $UI capture
          for key in j l l l l h b; do
            $UI key "$key"
            sleep 0.1
            $UI capture
          done
          $UI key j
          $UI key Enter
          sleep 0.1
          $UI capture
          $UI key e
          sleep 0.1
          $UI capture
          $UI key Escape
          $UI resize 160 40
          sleep 0.1
          $UI capture
